substitutions:
  node: vfd-matrix

esphome:
  name: ${node}
  project:
    name: 'noop.vfdmatrix'
    version: '0.1.0'

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
ota:
  platform: esphome
logger:

time:
  - platform: sntp
    id: ntp_time
    timezone: 'Europe/Paris'

font:
  - file: ATC.ttf
    id: atc
    size: 16
  - file: ATC.ttf
    id: atc2x
    size: 32
  - file: 3x5-Microfont-Mono.ttf
    id: microfont
    size: 8

output:
  - platform: template
    id: matrix_brightness_output
    type: float
    write_action:
      - lambda: |-
          id(vfd_matrix_disp).set_brightness(state);

light:
  - platform: monochromatic
    name: "Matrix Brightness"
    id: matrix_brightness
    output: matrix_brightness_output
    restore_mode: ALWAYS_ON

text:
  - platform: template
    id: msg_text_1
    name: ${node} msg line 0
    restore_value: true
    initial_value: "boop"
    mode: text
    optimistic: true
  - platform: template
    id: msg_text_2
    name: ${node} msg line 1
    restore_value: true
    initial_value: "boop"
    mode: text
    optimistic: true
  - platform: template
    id: msg_text_3
    name: ${node} msg line 2
    restore_value: true
    initial_value: "boop"
    mode: text
    optimistic: true

spi:
  clk_pin: 18
  mosi_pin: 26

display:
  - platform: gp12xx
    id: vfd_matrix_disp
    model: "GP1287 256x50"
    cs_pin: 19
    filament_pin: 22
    reset_pin: 21 # optional
    brightness: 80%
    rotation: 0
    update_interval: 0.5s
    lambda: |-
      auto time = id(ntp_time).now();

      it.printf(162, 2, id(atc2x), "%02d", time.hour);
      if (time.second % 2) {
        it.printf(207, 6, id(atc), ":");
      }
      it.printf(214, 2, id(atc2x), "%02d", time.minute);
      it.printf(160, 35, id(atc), "%02d\/%02d %02d", time.day_of_month, time.month, time.second);


      it.print(0, 0, id(atc), id(msg_text_1).state.c_str());
      it.print(0, 18, id(atc), id(msg_text_2).state.c_str());
      it.print(0, 35, id(microfont), id(msg_text_3).state.c_str());

binary_sensor:
  - platform: homeassistant
    name: study occupancy
    entity_id: binary_sensor.presence_kitchen_devices
    id: occupancy
    on_press:
      then:
        - lambda: |-
            id(vfd_matrix_disp).turn_on();
    on_release:
      then:
        - lambda: |-
            id(vfd_matrix_disp).turn_off();

switch:
  - platform: template
    name: "Matrix Inversion"
    lambda: |-
      return id(vfd_matrix_disp).is_inverted();
    turn_on_action:
      - lambda: |-
          id(vfd_matrix_disp).set_invert(true);
    turn_off_action:
      - lambda: |-
          id(vfd_matrix_disp).set_invert(false);

  - platform: template
    name: "Matrix Power"
    lambda: |-
      return id(vfd_matrix_disp).is_on();
    turn_on_action:
      - lambda: |-
          id(vfd_matrix_disp).turn_on();
    turn_off_action:
      - lambda: |-
          id(vfd_matrix_disp).turn_off();
